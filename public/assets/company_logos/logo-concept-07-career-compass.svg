<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="compBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0E4294"/>
    </linearGradient>
    <linearGradient id="compTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic: Compass & Graph Arrow -->
  <g transform="translate(150, 40)">
    <!-- Compass Circle -->
    <circle cx="90" cy="90" r="50" fill="none" stroke="url(#compBlue)" stroke-width="8"/>
    <!-- Compass Points -->
    <polygon points="90,25 97,45 83,45" fill="url(#compBlue)"/>
    <polygon points="90,155 97,135 83,135" fill="url(#compBlue)"/>
    <polygon points="25,90 45,97 45,83" fill="url(#compBlue)"/>
    <polygon points="155,90 135,97 135,83" fill="url(#compBlue)"/>

    <!-- Rising Graph Line with Nodes cutting across -->
    <path d="M 40 160 L 70 120 L 110 135 L 160 55" fill="none" stroke="url(#compTeal)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="148,55 170,45 165,70" fill="url(#compTeal)"/>

    <!-- Nodes -->
    <circle cx="40" cy="160" r="8" fill="url(#compBlue)"/>
    <circle cx="70" cy="120" r="8" fill="url(#compBlue)"/>
    <circle cx="110" cy="135" r="8" fill="url(#compBlue)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#EA580C" letter-spacing="2">
        UPGRADING RESOURCES
      </text>
    </g>
  </g>
</svg>
