<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!-- ========================================================
       CareerLineSolutions - Official Flat Vector Logo (Design #02)
       Emblem: 2D Hexagon Talent Progression Shield
       Colors: Royal Blue (#1855A5), Golden Amber (#E08E2B)
       ======================================================== -->
  <defs>
    <style>
      .cls-blue { fill: #1855A5; }
      .cls-gold { fill: #E08E2B; }
      .cls-dark { fill: #0B2C66; }
      .cls-stroke-blue { stroke: #1855A5; fill: none; stroke-linejoin: round; }
      .cls-stroke-gold { stroke: #E08E2B; fill: none; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Left: 2D Flat Hexagon Talent Shield (Design #02) -->
  <g transform="translate(14, 10)">
    <!-- Outer Hexagon Frame -->
    <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" class="cls-stroke-blue" stroke-width="8.5"/>
    <!-- Top-Right Accent Gold Bevel -->
    <path d="M 50 4 L 92 27 L 92 46" class="cls-stroke-gold" stroke-width="8.5" stroke-linecap="round"/>

    <!-- 3 Ascending Talent People Figures (Flat Amber Gold) -->
    <!-- Person 1 (Small) -->
    <circle cx="35" cy="45" r="3.6" class="cls-gold"/>
    <path d="M 31 51 C 31 49, 39 49, 39 51 L 39 61 L 31 61 Z" class="cls-gold"/>

    <!-- Person 2 (Medium) -->
    <circle cx="47" cy="38" r="4.2" class="cls-gold"/>
    <path d="M 42.5 45 C 42.5 42.5, 51.5 42.5, 51.5 45 L 51.5 59 L 42.5 59 Z" class="cls-gold"/>

    <!-- Person 3 (Tall Leader) -->
    <circle cx="60" cy="30" r="4.8" class="cls-gold"/>
    <path d="M 55 38 C 55 35, 65 35, 65 38 L 65 57 L 55 57 Z" class="cls-gold"/>

    <!-- Dynamic Highway Pathway (White negative space + Blue Ribbon) -->
    <path d="M 12 73 C 26 71, 42 66, 56 54 C 68 44, 80 28, 90 13" class="cls-stroke-blue" stroke-width="11" stroke-linecap="round"/>
    <path d="M 14 74 C 28 72, 44 67, 57 55 C 69 45, 78 31, 86 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Breakout Arrow Head -->
    <polygon points="78,16 98,8 91,28" class="cls-blue"/>

    <!-- Lower Gold Accent Path Line -->
    <path d="M 66 70 L 76 56" class="cls-stroke-gold" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="71,55 79,52 77,61" class="cls-gold"/>
  </g>

  <!-- Right: Official Typography (Design #02) -->
  <g transform="translate(132, 20)">
    <!-- Primary Company Name Line 1 -->
    <text x="0" y="38" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="33" letter-spacing="-0.5" fill="#1855A5">
      CAREERLINE
    </text>

    <!-- Primary Company Name Line 2 -->
    <text x="0" y="70" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="33" letter-spacing="1" fill="#1855A5">
      SOLUTIONS
    </text>

    <!-- Official Tagline Pill -->
    <g transform="translate(0, 83)">
      <text x="1" y="11" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="11.5" letter-spacing="3.2" fill="#0B2C66">
        TALENT. GROWTH. SUCCESS.
      </text>
    </g>

    <!-- Pan-India Badge Tag -->
    <g transform="translate(290, 81)">
      <rect x="0" y="0" width="100" height="15" rx="7.5" fill="#FFF7ED" stroke="#E08E2B" stroke-width="1"/>
      <text x="50" y="11" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#C2410C" letter-spacing="0.5">
        PAN-INDIA HR
      </text>
    </g>
  </g>
</svg>
