<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="clsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic -->
  <g transform="translate(140, 40)">
    <!-- Ascending 3D Bar Blocks -->
    <!-- Block 1 -->
    <polygon points="20,150 45,135 45,175 20,190" fill="#0284C7"/>
    <polygon points="20,150 45,135 65,145 40,160" fill="#38BDF8"/>

    <!-- Block 2 -->
    <polygon points="55,120 80,105 80,160 55,175" fill="#0369A1"/>
    <polygon points="55,120 80,105 100,115 75,130" fill="#38BDF8"/>

    <!-- Block 3 -->
    <polygon points="90,85 115,70 115,140 90,155" fill="#0E4294"/>
    <polygon points="90,85 115,70 135,80 110,95" fill="#60A5FA"/>

    <!-- Big Growth Arrow breaking out -->
    <path d="M 30 180 L 170 45" fill="none" stroke="url(#barBlue)" stroke-width="20" stroke-linecap="round"/>
    <polygon points="145,35 190,30 185,75" fill="#0284C7"/>

    <!-- CLS Monogram Overlay in Orange/Gold -->
    <g transform="translate(70, 165)">
      <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="44" letter-spacing="2" fill="url(#clsOrange)">
        CLS
      </text>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="32" letter-spacing="1" fill="#0E4294">
      CAREER LINE SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 50)">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#EA580C" letter-spacing="1.5">
        MANPOWER SUPPLY | UPGRADING FUTURE
      </text>
    </g>
  </g>
</svg>
