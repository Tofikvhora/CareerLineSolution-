<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="clBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0E4294"/>
    </linearGradient>
    <linearGradient id="clOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic: C and L Intertwined with Orange Arrow -->
  <g transform="translate(160, 45)">
    <!-- Letter C in Royal Blue -->
    <path d="M 65 55 C 25 55, 10 85, 10 120 C 10 155, 25 185, 65 185" fill="none" stroke="url(#clBlue)" stroke-width="20" stroke-linecap="round"/>

    <!-- Letter L in Royal Blue -->
    <path d="M 80 50 L 80 185 L 140 185" fill="none" stroke="url(#clBlue)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rising Orange Arrow Swoosh cutting through -->
    <path d="M 5 180 C 45 180, 105 150, 150 75" fill="none" stroke="url(#clOrange)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="135,70 165,55 160,95" fill="url(#clOrange)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#EA580C" letter-spacing="2">
        CONNECTING TALENT
      </text>
    </g>
  </g>
</svg>
