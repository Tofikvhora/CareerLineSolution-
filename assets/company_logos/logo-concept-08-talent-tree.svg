<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="treeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0E4294"/>
    </linearGradient>
    <linearGradient id="leafOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic: Talent Tree with People Branches & Leaves -->
  <g transform="translate(150, 35)">
    <!-- Main Trunk -->
    <path d="M 95 190 C 95 140, 80 120, 50 80" fill="none" stroke="url(#treeBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 105 190 C 105 140, 120 120, 150 80" fill="none" stroke="url(#treeBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 100 150 L 100 60" fill="none" stroke="url(#treeBlue)" stroke-width="12" stroke-linecap="round"/>

    <!-- Central Human Figure reaching up -->
    <circle cx="100" cy="40" r="10" fill="url(#treeBlue)"/>
    <polygon points="94,48 100,32 106,48" fill="url(#treeBlue)"/>

    <!-- Left & Right Human Figures -->
    <circle cx="50" cy="70" r="8" fill="url(#treeBlue)"/>
    <circle cx="150" cy="70" r="8" fill="url(#treeBlue)"/>

    <!-- Orange Growth Leaves / Arrows -->
    <!-- Leaf 1 -->
    <path d="M 40 50 C 30 65, 30 75, 45 75 C 55 65, 55 50, 40 50 Z" fill="url(#leafOrange)"/>
    <!-- Leaf 2 -->
    <path d="M 160 50 C 170 65, 170 75, 155 75 C 145 65, 145 50, 160 50 Z" fill="url(#leafOrange)"/>
    <!-- Leaf 3 -->
    <path d="M 70 30 C 60 45, 60 55, 75 55 C 85 45, 85 30, 70 30 Z" fill="url(#leafOrange)"/>
    <!-- Leaf 4 -->
    <path d="M 130 30 C 140 45, 140 55, 125 55 C 115 45, 115 30, 130 30 Z" fill="url(#leafOrange)"/>

    <!-- Roots Base Curve -->
    <path d="M 60 195 C 85 185, 115 185, 140 195" fill="none" stroke="url(#treeBlue)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#EA580C" letter-spacing="2">
        NURTURING TALENT
      </text>
    </g>
  </g>
</svg>
