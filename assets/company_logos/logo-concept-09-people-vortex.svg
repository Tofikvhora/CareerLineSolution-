<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vortBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0E4294"/>
    </linearGradient>
    <linearGradient id="vortOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic: People Swirl / Cyclone -->
  <g transform="translate(250, 130)">
    <!-- Central Orange Core -->
    <circle cx="0" cy="0" r="18" fill="url(#vortOrange)"/>

    <!-- Swirling Curved Arms with Head Dots (4 People forming cyclone) -->
    <!-- Arm 1 -->
    <g transform="rotate(0)">
      <path d="M 0 0 C 30 -10, 50 -40, 50 -70" fill="none" stroke="url(#vortBlue)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="50" cy="-70" r="8" fill="url(#vortBlue)"/>
    </g>
    <!-- Arm 2 -->
    <g transform="rotate(72)">
      <path d="M 0 0 C 30 -10, 50 -40, 50 -70" fill="none" stroke="url(#vortBlue)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="50" cy="-70" r="8" fill="url(#vortBlue)"/>
    </g>
    <!-- Arm 3 -->
    <g transform="rotate(144)">
      <path d="M 0 0 C 30 -10, 50 -40, 50 -70" fill="none" stroke="url(#vortBlue)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="50" cy="-70" r="8" fill="url(#vortBlue)"/>
    </g>
    <!-- Arm 4 -->
    <g transform="rotate(216)">
      <path d="M 0 0 C 30 -10, 50 -40, 50 -70" fill="none" stroke="url(#vortBlue)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="50" cy="-70" r="8" fill="url(#vortBlue)"/>
    </g>
    <!-- Arm 5 -->
    <g transform="rotate(288)">
      <path d="M 0 0 C 30 -10, 50 -40, 50 -70" fill="none" stroke="url(#vortBlue)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="50" cy="-70" r="8" fill="url(#vortBlue)"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#EA580C" letter-spacing="1.5">
        MANPOWER UPGRADATION
      </text>
    </g>
  </g>
</svg>
