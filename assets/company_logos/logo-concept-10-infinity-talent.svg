<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="infBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0E4294"/>
    </linearGradient>
    <linearGradient id="infGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Graphic: Infinity Loop with Rising Arrow -->
  <g transform="translate(130, 45)">
    <!-- Blue Loop Side -->
    <path d="M 120 120 C 80 80, 20 80, 20 120 C 20 160, 80 160, 120 120" fill="none" stroke="url(#infBlue)" stroke-width="18" stroke-linecap="round"/>

    <!-- Orange Loop Side rising into arrow -->
    <path d="M 120 120 C 160 80, 220 80, 220 120 C 220 160, 160 160, 120 120 L 225 35" fill="none" stroke="url(#infGold)" stroke-width="18" stroke-linecap="round"/>
    <polygon points="205,30 240,25 235,60" fill="url(#infGold)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-150" y="-16" width="300" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#EA580C" letter-spacing="2">
        ENDLESS OPPORTUNITIES
      </text>
    </g>
  </g>
</svg>
