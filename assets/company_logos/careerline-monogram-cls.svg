<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#9E7624"/>
    </linearGradient>
    <linearGradient id="blueM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B2C66"/>
    </linearGradient>
    <filter id="mDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B2C66" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#blueM)" filter="url(#mDrop)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldM)" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- CLS Monogram Letterform Graphic -->
  <g transform="translate(100, 92)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="54" letter-spacing="4" fill="#FFFFFF">
      C<tspan fill="url(#goldM)">L</tspan>S
    </text>
  </g>

  <!-- Arc Swoosh with Arrow -->
  <path d="M 40 135 C 75 160, 125 160, 160 135" fill="none" stroke="url(#goldM)" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="152,142 165,132 153,124" fill="url(#goldM)"/>

  <!-- Small text underneath -->
  <text x="100" y="174" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="10" letter-spacing="3" fill="#E2E8F0">
    CAREERLINE
  </text>
</svg>
