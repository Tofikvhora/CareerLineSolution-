<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="psBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F2D6B"/>
    </linearGradient>
    <linearGradient id="psGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center Icon -->
  <g transform="translate(140, 40)">
    <!-- 3 People ascending -->
    <!-- Person 1 -->
    <circle cx="45" cy="115" r="14" fill="url(#psBlue)"/>
    <path d="M 28 140 C 28 128, 62 128, 62 140 L 62 175 L 28 175 Z" fill="url(#psBlue)"/>

    <!-- Person 2 -->
    <circle cx="95" cy="90" r="16" fill="url(#psBlue)"/>
    <path d="M 76 118 C 76 104, 114 104, 114 118 L 114 175 L 76 175 Z" fill="url(#psBlue)"/>

    <!-- Person 3 (Tall in gold) -->
    <circle cx="150" cy="65" r="18" fill="url(#psGold)"/>
    <path d="M 128 95 C 128 78, 172 78, 172 95 L 172 175 L 128 175 Z" fill="url(#psGold)"/>

    <!-- Upward Swooshing Shooting Star Arc -->
    <path d="M 20 185 C 80 185, 170 160, 205 60" fill="none" stroke="url(#psGold)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Big Gold Star at apex -->
    <polygon points="205,35 212,52 230,52 215,63 221,80 205,70 189,80 195,63 180,52 198,52" fill="url(#psGold)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(250, 290)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      CAREER LINE
    </text>
    <text y="42" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0E4294">
      SOLUTIONS
    </text>

    <!-- Tagline pill -->
    <g transform="translate(0, 78)">
      <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
      <text y="5" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#EA580C" letter-spacing="2">
        EMPOWERING CAREERS
      </text>
    </g>
  </g>
</svg>
